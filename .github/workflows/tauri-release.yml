# Kept so app repos calling CTRL-Neo-Studios/prism/.github/workflows/tauri-release.yml@main keep working unchanged.
# It forwards to the module's reusable workflow with prism's endpoint and audience. New app repos should call
# CTRL-Neo-Studios/tauri-updater-backend/.github/workflows/tauri-release.yml@main directly (see docs/apps-release-guide.md).
name: Tauri release

on:
  workflow_call:
    inputs:
      app:
        description: App slug registered in prism's updater admin
        required: true
        type: string
      channel:
        description: Override the channel (default from the version, 1.0.0-beta.2 → beta, else stable)
        required: false
        type: string
        default: ''
      notes:
        description: Release notes shown in the update prompt (default the head commit message)
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  release:
    uses: CTRL-Neo-Studios/tauri-updater-backend/.github/workflows/tauri-release.yml@main
    with:
      app: ${{ inputs.app }}
      api: https://www.ctrl-neo.dev/apps
      audience: ctrl-neo-apps
      channel: ${{ inputs.channel }}
      notes: ${{ inputs.notes }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
